name: verify

on:
  pull_request:
  # A run can restore a cache saved on its own ref or on the base branch,
  # never another pull request's, so without this nothing ever saves one in
  # master's scope and every pull request's first run compiles the -race
  # build of every dependency from nothing.
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false